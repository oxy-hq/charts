apiVersion: v2
name: oxy
description: >-
  Deploys only the Oxy application workloads — the ide StatefulSet, the
  stateless serve and worker fleets, and the pre-upgrade migrate Job. Postgres,
  ClickHouse and Airhouse are external — managed outside this chart (RDS/CNPG,
  the ClickHouse operator, the airhouse chart) and wired in via connection env
  vars (OXY_DATABASE_*, OXY_CLICKHOUSE_*, AIRHOUSE_*). No bundled databases, no
  subchart dependencies.
type: application
# Standalone successor to the oxy-app chart with the bundled postgres/clickhouse
# subcharts removed. Renders byte-identical workloads to oxy-app for external-DB
# values (nameOverride keeps resource names), so adoption is a drop-in per-env
# chart swap. See README.md.
#
# 1.0.4 → 1.0.5: `serveFleet.metricsPort` renders the `OXY_METRICS_PORT` env
# AND a declared container port named `metrics`, from one value. Off by default
# (0), so the render is unchanged for every existing value set.
#
# 1.0.5 → 1.0.6: the same `serveFleet.metricsPort` now also renders the env and
# the declared `metrics` port on the ide StatefulSet. Still off by default, so
# a value set without it renders unchanged; with it set, the StatefulSet's pod
# template changes and the ide pod restarts. `env.OXY_METRICS_PORT` is now
# refused, since the shared env reaches the ide with no declared port.
version: 1.0.6
appVersion: "0.5.49"
keywords:
  - oxy
maintainers:
  - name: Oxy Team
    email: hello@oxy.tech
  - name: Luong Vo
    email: luong@oxy.tech
