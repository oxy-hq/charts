# Example: Enable the OpenTelemetry Collector sidecar exporting to an EXTERNAL
# ClickHouse. All ClickHouse settings are self-contained under
# otelCollector.clickhouse.* — this chart bundles no ClickHouse.

# OpenTelemetry Collector sidecar
otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib
  imageTag: "0.95.0"
  imagePullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Receiver ports (app sends traces to localhost:4317)
  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    metrics: 8888

  processors:
    batch:
      timeout: 10s
      sendBatchSize: 100
      sendBatchMaxSize: 1000
    memoryLimiter:
      checkInterval: 1s
      limitMib: 512

  # External ClickHouse exporter settings (self-contained).
  clickhouse:
    enabled: true
    # tcpEndpoint (preferred) / endpoint: the tcp:// address the exporter dials.
    tcpEndpoint: "tcp://clickhouse:9000"
    database: "otel"
    username: "default"
    # Dev/testing only — use passwordExistingSecret for production so the
    # password is injected via OXY_CLICKHOUSE_PASSWORD.
    password: "default"
    # passwordExistingSecret: clickhouse-credentials
    # passwordSecretKey: password
    logsTableName: "otel_logs"
    tracesTableName: "otel_traces"
    metricsTableName: "otel_metrics"
    asyncInsert: true
    compress: "lz4"
    createSchema: true
    ttl: "72h"
    timeout: "5s"
    retry:
      enabled: true
      initialInterval: "5s"
      maxInterval: "30s"
      maxElapsedTime: "300s"

  # Enable debug exporter for troubleshooting
  debug:
    enabled: false
    verbosity: "detailed"

  telemetry:
    logs:
      level: "info"

# Configure the app to send traces to the otel-collector sidecar. This chart
# bundles no database — point OXY_DATABASE_URL at an external Postgres.
env:
  OXY_STATE_DIR: /workspace/oxy_data
  OXY_DATABASE_URL: "postgresql://oxy:oxy@external-postgres:5432/oxy"
  # OTLP endpoint (collector runs as sidecar on localhost)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
