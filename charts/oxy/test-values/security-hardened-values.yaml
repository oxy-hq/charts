# Security-hardened integration test
nameOverride: "oxy-test-secure"
fullnameOverride: "oxy-test-secure"

app:
  image: "ghcr.io/oxy-hq/oxygen"
  imageTag: "0.5.49"
  imagePullPolicy: "Always"  # Always pull for security
  replicaCount: 1
  port: 3000

# Minimal resources for security testing
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Secure environment. This chart bundles no database — point OXY_DATABASE_URL
# at an external Postgres.
env:
  OXY_STATE_DIR: "/workspace/oxy_data"
  OXY_DATABASE_URL: "postgresql://oxy:oxy@external-postgres:5432/oxy"
  SECURITY_MODE: "strict"
  TLS_ENABLED: "true"

# Service account with minimal permissions
serviceAccount:
  create: true
  name: "oxy-secure-sa"
  annotations:
    "security.test/mode": "strict"

# Secure persistence settings
persistence:
  enabled: true
  size: "1Gi"
  accessMode: "ReadWriteOnce"
  mountPath: "/workspace"
  folder: "oxy_data"
  volumeMode: "Filesystem"
  annotations:
    "security.test/encrypted": "true"

# Strict node selection
nodeSelector:
  "security.test/approved": "true"

# Security tolerations
tolerations:
  - key: "security-zone"
    operator: "Equal"
    value: "restricted"
    effect: "NoSchedule"

# Enhanced security context
securityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000

# Strict probes for security validation
livenessProbe:
  httpGet:
    path: "/"
    port: 3000
    scheme: "HTTP"
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/"
    port: 3000
    scheme: "HTTP"
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

externalSecrets:
  create: false
  envSecretNames: []
  fileSecrets: []

extraInitContainers: []
extraSidecars: []

ingress:
  enabled: false