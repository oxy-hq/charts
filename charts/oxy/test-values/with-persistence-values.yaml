# Integration test with persistence enabled
nameOverride: "oxy-test-persist"
fullnameOverride: "oxy-test-persist"

app:
  image: "ghcr.io/oxy-hq/oxygen"
  imageTag: "0.5.49"
  imagePullPolicy: "IfNotPresent"
  replicaCount: 1

service:
  port: 80
  targetPort: 80

# Enable persistence for testing StatefulSet behavior
persistence:
  enabled: true
  accessMode: "ReadWriteOnce"
  size: "1Gi"
  mountPath: "/workspace"

# Environment variables. This chart bundles no database — point
# OXY_DATABASE_URL at an external Postgres.
env:
  OXY_STATE_DIR: "/workspace/oxy_data"
  OXY_DATABASE_URL: "postgresql://oxy:oxy@external-postgres:5432/oxy"

# Resource limits for CI
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

externalSecrets:
  envSecretNames: []
  fileSecrets: []