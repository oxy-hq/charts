apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oxy-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oxy-app.labels" . | nindent 4 }}
    version: v1
spec:
  serviceName: {{ include "oxy-app.fullname" . }}-headless
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- if gt (int (.Values.minReadySeconds | default 0)) 0 }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- end }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      {{- include "oxy-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oxy-app.selectorLabels" . | nindent 8 }}
        version: v1
        {{- /*
          HA-split routing anchor. When serveFleet is enabled, the main Service
          selects on this label so the catch-all `/` route reaches ONLY this
          singleton (which owns the working copy + drives compiles) — not the
          stateless serve pods (component=serve) nor the worker pods
          (component=worker), both of which also carry the bare
          name+instance selectorLabels. Gated so serveFleet-off deployments
          keep their exact current pod template (no rollout on upgrade).
        */}}
        {{- if .Values.serveFleet.enabled }}
        app.kubernetes.io/component: ide
        {{- end }}
    spec:
      {{- $sa := include "oxy-app.serviceAccountName" . }}
      {{- if ne $sa "" }}
      serviceAccountName: {{ $sa | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}

      {{- if .Values.extraInitContainers }}
      initContainers:
        {{- /* Render any user-supplied init containers */}}
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        # Main Application Container
        - name: {{ include "oxy-app.name" . }}
          image: "{{ .Values.app.image }}:{{ default .Chart.AppVersion .Values.app.imageTag }}"
          {{- $appArgs := and .Values.app.args (gt (len .Values.app.args) 0) }}
          {{- if and .Values.app.command (gt (len .Values.app.command) 0) }}
          command:
            {{- range .Values.app.command }}
            - {{ . | quote }}
            {{- end }}
          {{- else if not $appArgs }}
          {{- /* No override: the chart's own shell wrapper. This REPLACES the
                 image ENTRYPOINT — use app.args instead when the entrypoint
                 must stay in front of the process (see values.yaml). */}}
          command:
            - sh
            - -c
            - |
              exec oxy serve{{- if .Values.app.internalHost }} --internal-host {{ .Values.app.internalHost }} --internal-port {{ .Values.app.internalPort }}{{- end }}
          {{- end }}
          {{- if $appArgs }}
          args:
            {{- range .Values.app.args }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.app.port }}
              protocol: TCP
              name: traffic-port
            {{- if .Values.app.internalHost }}
            - containerPort: {{ .Values.app.internalPort }}
              protocol: TCP
              name: internal-port
            {{- end }}

          # Environment Variables
          env:
            # Role classification — oxygen-internal PR #2505 routing guardrail.
            # IDE singleton: owns the workspace working copy + .git tree.
            # Accepts every route (IdeOnly + FleetOk) on this pod. When
            # serveFleet is enabled, the path-based ingress routes the
            # write-heavy IDE surface here while stateless reads go to oxy-serve.
            - name: OXY_ROLE
              value: "ide"
            # Shared AES-256 master key so workspace secrets encrypt/decrypt
            # identically across the fleet (values.yaml encryptionKey). Without it
            # each pod generates a divergent on-disk key → cross-pod
            # "decryption failed". Same Secret on the StatefulSet, serve and worker.
            {{- if .Values.encryptionKey.secretName }}
            - name: OXY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionKey.secretName | quote }}
                  key: {{ .Values.encryptionKey.secretKey | default "OXY_ENCRYPTION_KEY" | quote }}
            {{- end }}
            # State Directory Configuration
            {{- if and .Values.env.OXY_STATE_DIR (ne .Values.env.OXY_STATE_DIR "") }}
            - name: OXY_STATE_DIR
              value: {{ .Values.env.OXY_STATE_DIR | quote }}
            {{- else }}
            - name: OXY_STATE_DIR
              value: {{ printf "%s/%s" .Values.persistence.mountPath .Values.persistence.folder | quote }}
            {{- end }}


            # Compile-boundary global driver: drive the Global task queue
            # (incl. TaskSpec::Compile) in-process. The StatefulSet is the only
            # node with the working copy, so compiles can ONLY run here.
            {{- if .Values.appServer.inprocGlobalWorker }}
            - name: OXY_INPROC_GLOBAL_WORKER
              value: "1"
            {{- end }}
            # The pre-upgrade migrate Job owns schema migrations; the StatefulSet
            # (the canonical migrator) stands down so it doesn't re-run them on
            # boot. The serve fleet already sets this unconditionally.
            {{- if .Values.migrations.enabled }}
            - name: OXY_SKIP_MIGRATIONS
              value: "1"
            {{- end }}
            # Compile-boundary S3 offload (semantic blobs + local-DuckDB mirror).
            # This is the compile WRITER, so it needs the bucket to upload.
            {{- if .Values.compileBoundary.blobS3Bucket }}
            - name: OXY_COMPILE_BLOB_S3_BUCKET
              value: {{ .Values.compileBoundary.blobS3Bucket | quote }}
            {{- end }}

            # Database URL Configuration
            # Preference order (sqlite fallback intentionally omitted):
            # 1) Explicit value provided by caller via values.env.OXY_DATABASE_URL
            # 2) Explicit external.connectionString or external fields
            # 3) Postgres subchart connection (if user enabled it manually)
            # If none are provided, OXY_DATABASE_URL will not be set
            {{- if and .Values.env.OXY_DATABASE_URL (ne .Values.env.OXY_DATABASE_URL "") }}
            - name: OXY_DATABASE_URL
              value: {{ .Values.env.OXY_DATABASE_URL | quote }}
            {{- end }}

            # Additional environment variables from values.env
            {{- range $key, $value := .Values.env }}
            {{- if and (ne $key "OXY_STATE_DIR") (ne $key "OXY_DATABASE_URL") }}
            {{- if ne $value "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}

          # ConfigMap / Secret Environment Variables
          {{- if or .Values.configMap.enabled (gt (len .Values.externalSecrets.envSecretNames) 0) }}
          envFrom:
            {{- if .Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "oxy-app.fullname" . }}-config
            {{- end }}
            {{- range .Values.externalSecrets.envSecretNames }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}

          # Resource Limits and Requests
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # Volume Mounts
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.persistence.mountPath }}
            {{- /* Mount environment secrets */}}
            {{- range $idx, $secretName := .Values.externalSecrets.envSecretNames }}
            - name: env-secret-{{ $idx }}
              mountPath: /secrets/env/{{ $secretName }}
              readOnly: true
            {{- end }}
            {{- /* Mount file secrets */}}
            {{- range $idx, $fileSecret := .Values.externalSecrets.fileSecrets }}
            - name: file-secret-{{ $idx }}
              mountPath: /secrets/files/{{ $fileSecret.name }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # Health Checks
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        {{- /* Render user-supplied sidecars after built-in sidecars */}}
        {{- with .Values.extraSidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # Volume Definitions
      volumes:
        {{- /* Environment secret volumes */}}
        {{- range $idx, $secretName := .Values.externalSecrets.envSecretNames }}
        - name: env-secret-{{ $idx }}
          secret:
            secretName: {{ $secretName | quote }}
            optional: true
        {{- end }}
        {{- /* File secret volumes */}}
        {{- range $idx, $fileSecret := .Values.externalSecrets.fileSecrets }}
        - name: file-secret-{{ $idx }}
          secret:
            secretName: {{ $fileSecret.name | quote }}
            optional: true
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: workspace
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # Node Selection and Tolerations
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

  # Persistent Volume Claim Templates
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: workspace
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.persistence.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        {{- with .Values.persistence.volumeMode }}
        volumeMode: {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
