suite: no bundled databases
# Guards the whole point of the `oxy` chart vs its `oxy-app` predecessor: it
# carries NO database subchart dependencies (see Chart.yaml — no `dependencies:`)
# and, as deployed, spins up no in-cluster database. External Postgres/ClickHouse
# are reached purely via env (OXY_DATABASE_* / OXY_CLICKHOUSE_*).
#
# NOTE: a handful of vestigial `database.*` template branches (the wait-for-DB
# init containers) still exist inert behind default-false flags; their removal is
# tracked as a follow-up. This suite pins the deployed behaviour: with the values
# every environment actually uses, no DB init container is rendered.
templates:
  - statefulset.yaml
tests:
  - it: renders no wait-for-postgres / wait-for-clickhouse init container (default values)
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-postgres
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-clickhouse

  - it: renders no DB init container for a representative external-DB config
    set:
      git:
        enabled: false
      env:
        OXY_DATABASE_URL: "postgresql://oxy:pw@ext-postgres.example:5432/oxydb"
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-postgres
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: wait-for-clickhouse
