suite: otel-collector tests
templates:
  - otel-configmap.yaml
  - statefulset.yaml

tests:
  # =======================
  # ConfigMap Tests
  # =======================

  - it: should not render otel ConfigMap when disabled
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render otel ConfigMap when enabled
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://clickhouse:9000"
          database: "otel"
          username: "default"
          password: "default"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oxy-app-otel-collector
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: oxy-app

  - it: should render the external ClickHouse exporter config
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://my-clickhouse:9000"
          database: "mydb"
          username: "myuser"
          password: "mypassword"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: tcp://my-clickhouse:9000"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "database: mydb"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: myuser"

  - it: should prefer tcpEndpoint over endpoint when both are set
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          endpoint: "tcp://fallback-ch:9000"
          tcpEndpoint: "tcp://clickhouse-tcp:9440"
          database: "otel"
          username: "default"
          password: "default"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: tcp://clickhouse-tcp:9440"

  - it: should fall back to the endpoint field when tcpEndpoint is unset
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          endpoint: "tcp://otel-specific-ch:9000"
          database: "otel_traces"
          username: "otel_user"
          password: "otel_password"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: tcp://otel-specific-ch:9000"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "database: otel_traces"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "username: otel_user"

  - it: should source the exporter password from OXY_CLICKHOUSE_PASSWORD when using a secret
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://clickhouse:9000"
          passwordExistingSecret: my-clickhouse-secret
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'password: \$\{env:OXY_CLICKHOUSE_PASSWORD\}'

  - it: should configure custom table names
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://clickhouse:9000"
          logsTableName: "custom_logs"
          tracesTableName: "custom_traces"
          metricsTableName: "custom_metrics"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "logs_table_name: custom_logs"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "traces_table_name: custom_traces"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "metrics_table_name: custom_metrics"

  - it: should configure custom ports
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        ports:
          otlpGrpc: 14317
          otlpHttp: 14318
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://clickhouse:9000"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: 0.0.0.0:14317"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "endpoint: 0.0.0.0:14318"

  - it: should enable debug exporter when configured
    template: otel-configmap.yaml
    set:
      otelCollector:
        enabled: true
        debug:
          enabled: true
          verbosity: "detailed"
        clickhouse:
          enabled: true
          tcpEndpoint: "tcp://clickhouse:9000"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "debug:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "verbosity: detailed"

  # =======================
  # StatefulSet Sidecar Tests
  # =======================

  - it: should not add otel-collector sidecar when disabled
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: oxy-app

  - it: should add otel-collector sidecar when enabled
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: otel-collector

  - it: should configure otel-collector image correctly
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
        image: "otel/opentelemetry-collector-contrib"
        imageTag: "0.95.0"
        imagePullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: "otel/opentelemetry-collector-contrib:0.95.0"
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: should expose correct ports on otel-collector
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
        ports:
          otlpGrpc: 4317
          otlpHttp: 4318
          metrics: 8888
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            containerPort: 4317
            protocol: TCP
            name: otlp-grpc
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            containerPort: 4318
            protocol: TCP
            name: otlp-http
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            containerPort: 8888
            protocol: TCP
            name: metrics

  - it: should configure otel-collector resources
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[1].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[1].resources.limits.memory
          value: 1Gi

  - it: should mount otel-collector config volume
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: otel-collector-config
            mountPath: /etc/otelcol
            readOnly: true

  - it: should add otel-collector config volume
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: otel-collector-config
            configMap:
              name: RELEASE-NAME-oxy-app-otel-collector

  - it: should inject OXY_CLICKHOUSE_PASSWORD from passwordExistingSecret
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          passwordExistingSecret: my-clickhouse-secret
          passwordSecretKey: ch-password
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: OXY_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-clickhouse-secret
                key: ch-password

  - it: should not inject a ClickHouse password env when using an inline password
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
        clickhouse:
          password: "inline-password"
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env

  - it: should configure health probes for otel-collector
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[1].startupProbe.httpGet.port
          value: 13133
      - equal:
          path: spec.template.spec.containers[1].startupProbe.failureThreshold
          value: 12
      - equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.port
          value: 13133
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.port
          value: 13133

  - it: should work with otel-collector and extraSidecars
    template: statefulset.yaml
    set:
      otelCollector:
        enabled: true
      extraSidecars:
        - name: custom-sidecar
          image: busybox:latest
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
      - equal:
          path: spec.template.spec.containers[0].name
          value: oxy-app
      - equal:
          path: spec.template.spec.containers[1].name
          value: otel-collector
      - equal:
          path: spec.template.spec.containers[2].name
          value: custom-sidecar
