name: Helm publish

# This workflow publishes all Helm charts after their respective tests pass
# It runs after either:
# - helm-ci.yml (oxy-app full tests) completes
# - helm-lint-only.yml (oxy-start, oxy linting) completes

on:
  workflow_run:
    workflows: ["Helm tests and release (oxy-app)", "Helm lint-only (lightweight charts)"]
    types:
      - completed
    branches:
      - main

# One publish at a time. Two merges close together, or one PR touching both
# upstream workflows' paths, fire two publish runs on the same main commit (two
# overlapped on dfd4303, 2026-09-26). Unserialized, both could record the tag
# list before either creates the release, and both would push that version.
# A queued run that gets replaced loses nothing: each run releases every chart
# changed since the last tag, at the newest main.
concurrency:
  group: helm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Package & Publish Helm charts
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)
      packages: write # needed for ghcr access
    steps:
      - name: Verify workflow success
        run: |
          echo "✅ Triggering workflow '${{ github.event.workflow_run.name }}' completed successfully"
          echo "Proceeding with chart publishing..."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.ARGO_APP_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Git
        run: |
          git config --global user.email "153820223+oxyhelper[bot]@users.noreply.github.com"
          git config --global user.name "oxyhelper[bot]"

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Add dependency chart repos
        run: |
          # Add all required chart repositories for dependencies
          # groundhog2k: Used by oxy-app for PostgreSQL/ClickHouse subcharts
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          # Add additional repos here as needed for other charts

      # chart-releaser repackages a chart whose files changed even when its
      # version did not, and --skip-existing skips only the GitHub release. The
      # GHCR push therefore decides for itself, from the release tags on either
      # side of chart-releaser: see .github/scripts/chart-packages-to-push.sh.
      - name: Record release tags before chart-releaser
        run: .github/scripts/chart-packages-to-push.sh snapshot > "$RUNNER_TEMP/tags-before"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ steps.app-token.outputs.token }}"
          CR_SKIP_EXISTING: "true"
        with:
          charts_dir: charts
          config: cr.yaml

      - name: Select the packages released in this run
        run: .github/scripts/chart-packages-to-push.sh select .cr-release-packages "$RUNNER_TEMP/tags-before" > "$RUNNER_TEMP/to-push"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the versions released in this run. A re-run after this step failed
      # finds those releases already present and pushes nothing: push the
      # missing version by hand (it is absent from GHCR, so nothing is overwritten).
      - name: Push newly released charts to GHCR
        run: |
          while IFS= read -r pkg; do
            helm push "${pkg}" "oci://ghcr.io/${{ github.repository_owner }}/helm-charts"
          done < "$RUNNER_TEMP/to-push"
