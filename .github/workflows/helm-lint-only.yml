name: Helm lint-only (lightweight charts)

# Lightweight workflow for charts that only need linting validation
# Currently used for: oxy-start, oxy
# These charts don't require extensive integration testing

on:
  push:
    branches:
      - main
    paths:
      - "charts/oxy-start/**"
      - "charts/oxy/**"
  pull_request:
    branches:
      - main
    paths:
      - "charts/oxy-start/**"
      - "charts/oxy/**"
      # Self-test: a change to this workflow should exercise this workflow.
      - ".github/workflows/helm-lint-only.yml"

jobs:
  lint:
    name: Lint charts (oxy-start)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      # `--use-helmignore` (here and on ct lint, so the two agree): a file the
      # chart's .helmignore drops — `tests/` in both charts — is not shipped, so
      # changing it is not a chart change and must not demand a version bump.
      # Without it a tests-only PR fails "Needs a version bump!", and the only
      # way through is to burn a chart version on a byte-identical package.
      # Scoped to this workflow: helm-ci.yml gates oxy-app's unit tests on
      # list-changed, so a global ct.yaml setting would skip them there.
      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --chart-dirs charts --use-helmignore)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts: $changed"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name != 'pull_request' || steps.list-changed.outputs.changed == 'true'
        run: |
          # Lint whatever lightweight chart changed (oxy-start or oxy) rather than
          # a hardcoded chart — ct lint uses the target-branch diff to pick them.
          ct lint --target-branch ${{ github.event.repository.default_branch }} --config ct.yaml --use-helmignore

      # `ct lint` only parses and renders — it asserts nothing about WHAT is
      # rendered (e.g. the serve-fleet `--enterprise` regression). Run both
      # lightweight charts' helm-unittest suites; the whole run is a few seconds.
      # Not gated on list-changed: a tests-only or workflow-only change lists no
      # changed chart (see above), and exactly those changes must still run the
      # suites. The glob picks up every `*_test.yaml`, so new suites need no edit.
      - name: Run unit tests (oxy, oxy-start)
        run: |
          export CI=true
          for chart in oxy oxy-start; do
            echo "::group::helm unittest charts/$chart"
            helm unittest "charts/$chart" -f "tests/**/*_test.yaml"
            echo "::endgroup::"
          done
