name: Helm lint-only (lightweight charts)

# Lightweight workflow for charts that only need linting validation
# Currently used for: oxy-start, oxy
# These charts don't require extensive integration testing

on:
  push:
    branches:
      - main
    paths:
      - "charts/oxy-start/**"
      - "charts/oxy/**"
  pull_request:
    branches:
      - main
    paths:
      - "charts/oxy-start/**"
      - "charts/oxy/**"
      # Self-test: a change to this workflow should exercise this workflow.
      - ".github/workflows/helm-lint-only.yml"

jobs:
  lint:
    name: Lint charts (oxy-start)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Install helm-unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --chart-dirs charts)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts: $changed"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name != 'pull_request' || steps.list-changed.outputs.changed == 'true'
        run: |
          # Lint whatever lightweight chart changed (oxy-start or oxy) rather than
          # a hardcoded chart — ct lint uses the target-branch diff to pick them.
          ct lint --target-branch ${{ github.event.repository.default_branch }} --config ct.yaml

      # `ct lint` only parses and renders — it asserts nothing about WHAT is
      # rendered. Both lightweight charts ship helm-unittest suites that were
      # never executed by any workflow (helm-ci.yml is path-filtered to
      # charts/oxy-app/**), so a chart could render the wrong container spec and
      # still go green. Run them here; the whole suite takes under a second.
      # Not gated on list-changed: the paths filter above already limits this
      # workflow to these two charts, and a shared-file change should run both.
      - name: Run unit tests (oxy, oxy-start)
        run: |
          export CI=true
          for chart in oxy oxy-start; do
            echo "::group::helm unittest charts/$chart"
            helm unittest "charts/$chart" -f "tests/**/*_test.yaml"
            echo "::endgroup::"
          done
