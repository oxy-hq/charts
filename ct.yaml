chart-dirs:
  - charts
# No path exclusions here: ct has no `exclude` key (its `excluded-charts` drops
# whole charts), so a `charts/**/tests/**` glob in this file did nothing. What
# keeps a tests-only change from counting as a chart change is `--use-helmignore`
# on ct list-changed / ct lint in helm-lint-only.yml: each chart's .helmignore
# drops tests/, so ct ignores the files the package never ships.
# Chart repositories for dependencies
# groundhog2k: Used by oxy-app for postgres and clickhouse subcharts
chart-repos:
  - groundhog2k=https://groundhog2k.github.io/helm-charts/
remote: origin
target-branch: main
github-groups: true
helm-extra-args: --timeout 600s
validate-maintainers: false
# Enable dependency management
helm-dependency-extra-args: --skip-refresh
# Additional validation
validate-yaml: true
lint-conf: lintconf.yaml
# Check for security issues
check-version-increment: true